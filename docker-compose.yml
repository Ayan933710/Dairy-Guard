version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nandi-db
    restart: always
    environment:
      POSTGRES_USER: nandi_user
      POSTGRES_PASSWORD: nandi_secure_password # CHANGE THIS IN PRODUCTION
      POSTGRES_DB: nandi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nandi_user -d nandi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nandi-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nandi_user:nandi_secure_password@db:5432/nandi_db # Connects to the db container
      - CLIENT_ORIGIN=http://${EC2_PUBLIC_IP} # Loaded from .env in production
      - JWT_SECRET=nandi_prod_jwt_s3cr3t_k3y_2026_xK9mP2vL
      - DEVICE_INGEST_KEY=esp32_hardware_key_1234
      - AI_SERVICE_URL=http://ai_service:8000
      - AI_SERVICE_ENABLED=true
      - DEMO_VIDEO_URL=${DEMO_VIDEO_URL}
    # Add other necessary backend env vars here or load from an .env file

  ai_service:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    container_name: nandi-ai-service
    restart: always
    ports:
      - "8000:8000"
    # If the AI service needs DB access, ensure it connects to 'db' instead of 'localhost'
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql://nandi_user:nandi_secure_password@db:5432/nandi_db # CHANGE THIS IN PRODUCTION

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://${EC2_PUBLIC_IP}:5000/api
        - VITE_SOCKET_URL=http://${EC2_PUBLIC_IP}:5000
        - VITE_AI_URL=http://${EC2_PUBLIC_IP}:8000
        - VITE_ANDROID_APK_URL=http://${EC2_PUBLIC_IP}:5000/nandi.apk
    container_name: nandi-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
